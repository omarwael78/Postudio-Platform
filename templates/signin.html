{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'images/fav.png' %}" rel="icon" type="image/png">
    <title>Sign In — postudio</title>
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/uikit.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/tailwind.css' %}">
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen">

    <div class="flex flex-col justify-between min-h-screen">
        <div class="bg-white/80 backdrop-blur-sm py-4 shadow-sm">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex items-center justify-between">
                    <a href="/" class="brand-logo" style="font-size:1.6rem;">postudio</a>
                    <a href="/signup" class="brand-btn px-6 py-2.5 rounded-full text-sm">Create Account</a>
                </div>
            </div>
        </div>

        <div class="flex-1 flex items-center justify-center px-4">
            <div class="w-full max-w-md">
                <div class="brand-card p-8">
                    <div class="text-center mb-8">
                        <span class="brand-logo" style="font-size:2rem; display:inline-block;">postudio</span>
                        <p class="text-gray-500 text-sm mt-2">Your social studio — sign in to continue</p>
                    </div>

                    {% for message in messages %}
                    <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md mb-4 text-sm">
                        {{message}}
                    </div>
                    {% endfor %}

                    <form action="/signin" method="POST">
                        {% csrf_token %}
                        <input type="text" name="username" placeholder="Username" class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm bg-gray-50 focus:bg-white transition mb-3" required>
                        <input type="password" name="password" placeholder="Password" class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm bg-gray-50 focus:bg-white transition mb-4" required>
                        <button type="submit" class="brand-btn w-full py-3 rounded-full text-base font-semibold">Sign In</button>
                        <p class="text-center text-sm text-gray-500 mt-5">Don't have an account? <a href="/signup" class="text-purple-600 font-semibold hover:text-purple-800">Sign up</a></p>
                    </form>
                </div>
            </div>
        </div>

        <footer class="py-4">
            <div class="max-w-6xl mx-auto px-4 flex flex-wrap items-center justify-between gap-3">
                <div class="flex space-x-4 text-xs text-gray-400">
                    <a href="#" class="hover:text-gray-600">About</a>
                    <a href="#" class="hover:text-gray-600">Help</a>
                    <a href="#" class="hover:text-gray-600">Terms</a>
                    <a href="#" class="hover:text-gray-600">Privacy</a>
                </div>
                <p class="text-xs text-gray-400">All rights reserved to Eng.Omar Wael</p>
            </div>
        </footer>
    </div>

    <script src="{% static 'assets/js/tippy.all.min.js' %}"></script>
    <script src="{% static 'assets/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'assets/js/uikit.js' %}"></script>
    <script src="{% static 'assets/js/simplebar.js' %}"></script>
    <script src="{% static 'assets/js/custom.js' %}"></script>
</body>
</html>
