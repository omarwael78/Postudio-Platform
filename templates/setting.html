{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'images/fav.png' %}" rel="icon" type="image/png">
    <title>Settings — postudio</title>
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/uikit.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/tailwind.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        .ig-header {
            background: white;
            border-bottom: 1px solid #dbdbdb;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 60px;
        }
        .ig-header-inner {
            max-width: 935px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .ig-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ig-brand {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #833AB4, #FD1D1D, #FCB045);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .ig-back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #262626;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
        }
        .ig-back-link:hover { color: #0095f6; }
        .ig-back-link svg { width: 20px; height: 20px; }
        .ig-header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .ig-settings-wrapper {
            max-width: 600px;
            margin: 80px auto 0;
            padding: 20px;
        }

        .ig-settings-card {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .ig-settings-card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #dbdbdb;
        }
        .ig-settings-card-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #262626;
        }

        .ig-settings-photo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid #efefef;
        }
        .ig-settings-photo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #dbdbdb;
        }
        .ig-settings-photo-info {
            flex: 1;
        }
        .ig-settings-photo-info .username {
            font-size: 1rem;
            font-weight: 600;
            color: #262626;
            margin-bottom: 4px;
        }
        .ig-settings-photo-upload {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0095f6;
            cursor: pointer;
            background: none;
            border: none;
        }
        .ig-settings-photo-upload:hover { color: #00376b; }

        .ig-settings-field {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ig-settings-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #8e8e8e;
            text-transform: capitalize;
        }
        .ig-settings-field input,
        .ig-settings-field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #262626;
            background: #fafafa;
            transition: border-color 0.2s;
        }
        .ig-settings-field input:focus,
        .ig-settings-field textarea:focus {
            border-color: #a8a8a8;
            outline: none;
            background: white;
        }
        .ig-settings-field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .ig-settings-submit {
            padding: 8px 24px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin: 12px 20px 20px;
        }
        .ig-settings-submit:hover { background: #1877f2; }

        .ig-settings-danger-section {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .ig-settings-danger-header {
            padding: 16px 20px;
            border-bottom: 1px solid #dbdbdb;
        }
        .ig-settings-danger-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #ed4956;
        }

        .ig-alert {
            padding: 14px 18px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ig-alert.success {
            background: #edf7ed;
            border: 1px solid #b4e3b4;
            color: #1a7a1a;
        }
        .ig-alert.error {
            background: #fdeeed;
            border: 1px solid #f5c6c6;
            color: #dc2626;
        }

        .ig-footer {
            background: white;
            border-top: 1px solid #dbdbdb;
            margin-top: 40px;
            padding: 24px 20px;
            text-align: center;
        }
        .ig-footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .ig-footer-links a {
            color: #8e8e8e;
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ig-footer-links a:hover { color: #262626; }
        .ig-footer-copy {
            color: #c7c7c7;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header class="ig-header">
        <div class="ig-header-inner">
            <div class="ig-header-left">
                <a href="/" class="ig-brand">postudio</a>
                <a href="/" class="ig-back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
            </div>
            <div>
                <a href="/profile/{{request.user.username}}/">
                    <img src="{{user_profile.profileimg.url}}" class="ig-header-avatar" alt=""
                         onerror="this.src='{% static 'assets/images/avatars/avatar-1.jpg' %}'">
                </a>
            </div>
        </div>
    </header>

    <div class="ig-settings-wrapper">
        {% for message in messages %}
        <div class="ig-alert {% if message.tags == 'success' %}success{% else %}error{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd"/>
            </svg>
            {{message}}
        </div>
        {% endfor %}

        <div class="ig-settings-card">
            <form action="/settings/" method="POST" enctype="multipart/form-data" id="profileForm">
                {% csrf_token %}
                <div class="ig-settings-photo-section">
                    <img src="{{user_profile.profileimg.url}}" class="ig-settings-photo" alt=""
                         onerror="this.src='{% static 'assets/images/avatars/avatar-1.jpg' %}'">
                    <div class="ig-settings-photo-info">
                        <div class="username">{{request.user.username}}</div>
                        <label class="ig-settings-photo-upload" for="profileImageInput">Change profile photo</label>
                        <input type="file" id="profileImageInput" name="image" accept="image/*" style="display:none;" onchange="this.form.submit()">
                    </div>
                </div>
                <div class="ig-settings-field">
                    <label>Bio</label>
                    <textarea name="bio" placeholder="Tell people about yourself...">{{user_profile.bio}}</textarea>
                </div>
                <div class="ig-settings-field">
                    <label>Location</label>
                    <input type="text" name="location" value="{{user_profile.location}}" placeholder="Where are you based?">
                </div>
                <button type="submit" class="ig-settings-submit">Submit</button>
            </form>
        </div>

        <div class="ig-settings-danger-section">
            <div class="ig-settings-danger-header">
                <h3>Change Password</h3>
            </div>
            <form method="POST" action="/settings/">
                {% csrf_token %}
                <div class="ig-settings-field">
                    <label>Current Password</label>
                    <input type="password" name="old_password" placeholder="Current password" required>
                </div>
                <div class="ig-settings-field">
                    <label>New Password</label>
                    <input type="password" name="new_password1" placeholder="New password" required>
                </div>
                <div class="ig-settings-field">
                    <label>Confirm New Password</label>
                    <input type="password" name="new_password2" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="ig-settings-submit">Change Password</button>
            </form>
        </div>
    </div>

    <footer class="ig-footer">
        <div class="ig-footer-links">
            <a href="/">Feed</a>
            <a href="#">About</a>
            <a href="#">Privacy</a>
        </div>
        <div class="ig-footer-copy">All rights reserved to Eng.Omar Wael</div>
    </footer>

    <script src="{% static 'assets/js/tippy.all.min.js' %}"></script>
    <script src="{% static 'assets/js/uikit.js' %}"></script>
    <script src="{% static 'assets/js/simplebar.js' %}"></script>
    <script src="{% static 'assets/js/custom.js' %}"></script>
</body>
</html>
